<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Enter M-SEPA PIN</title>
<style>
  /* ---------- RESET ---------- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- BODY: dark background + center ---------- */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: clamp(10px, 3.5vw, 20px);
    padding-top: max(clamp(10px, 3.5vw, 20px), env(safe-area-inset-top));
    padding-bottom: max(clamp(10px, 3.5vw, 20px), env(safe-area-inset-bottom));
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ---------- CARD: stretches top-to-bottom of the screen ---------- */
  .card {
    width: 100%;
    max-width: 380px;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(8px, 2vh, 16px);
    padding-block: clamp(4px, 1.5vh, 12px);
  }

  /* ---------- TITLE (near the top) ---------- */
  .title {
    font-size: clamp(0.8rem, 3.8vw, 1.05rem);
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #ffffff;
    flex: 0 0 auto;
  }

  /* ---------- AVATAR (burgundy background) ---------- */
  .avatar {
    width: clamp(54px, 17vw, 76px);
    height: clamp(54px, 17vw, 76px);
    flex: 0 0 auto;
    border-radius: 50%;
    background: #660033;                                        /* burgundy */
    border: 2px solid #660033;                                  /* border same as background */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.05rem, 5vw, 1.55rem);
    font-weight: 600;
    color: #f472b6;                  /* pink initials */
    box-shadow: 0 8px 24px rgba(102, 0, 51, 0.45);/* matching glow */
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- NAME ---------- */
  .name {
    font-size: clamp(0.78rem, 3.6vw, 0.95rem);
    font-weight: 600;
    letter-spacing: 0.4px;
    color: #ffffff;
    flex: 0 0 auto;
  }

  /* ---------- 10-DIGIT NUMBER (masked) ---------- */
  .phone {
    font-size: clamp(0.75rem, 3.9vw, 0.9rem);
    letter-spacing: 1.6px;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  .phone .mask {
    color: #ffffff;
    opacity: 0.75;
    letter-spacing: 0.4px;      /* stars sit tight against the digits */
    margin: 0 1px;
  }

  /* ---------- NUMBER (line 1) + BADGE (line 2) ---------- */
  .meta-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.4vh, 10px);
    width: 100%;
    flex: 0 0 auto;
  }

  .data-badge {
    flex: 0 1 auto;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: clamp(0.8rem, 4vw, 0.95rem);
    line-height: 1.3;
    letter-spacing: 0.2px;
    color: #ffffff;
    background: #12211a;                /* near-black, faint green tint */
    border-radius: 5px;                 /* near-rectangle */
    padding: clamp(6px, 1.5vh, 9px) clamp(11px, 3.4vw, 16px);
  }

  /* ---------- NOTICE (single line, red) ---------- */
  .notice {
    display: none;                     /* hidden = takes no space at all */
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: clamp(0.58rem, 2.8vw, 0.66rem);
    line-height: 1.2;
    letter-spacing: 0.2px;
    color: #ff5c5c;
    flex: 0 0 auto;
  }

  .notice.show {
    display: block;
    animation: noticeIn 0.2s ease;
  }

  @keyframes noticeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pin-boxes.shake {
    animation: shake 0.35s ease;
  }

  /* confirming: dots pulse while the PIN is being checked */
  .pin-boxes.checking .pin-box.filled::after {
    animation: pulse 0.55s ease-in-out infinite;
  }

  .pin-boxes.checking .pin-box.filled {
    animation: glow 0.55s ease-in-out infinite;
  }

  .pin-boxes.checking .pin-box:nth-child(2)::after { animation-delay: 0.08s; }
  .pin-boxes.checking .pin-box:nth-child(3)::after { animation-delay: 0.16s; }
  .pin-boxes.checking .pin-box:nth-child(4)::after { animation-delay: 0.24s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.5); }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 6px rgba(34, 197, 94, 0.2); }
    50% { box-shadow: 0 0 16px rgba(34, 197, 94, 0.6); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ---------- PIN BOXES ---------- */
  .pin-boxes {
    display: flex;
    gap: clamp(10px, 3.4vw, 16px);
    margin: clamp(6px, 2vh, 16px) 0 clamp(2px, 1vh, 8px);
    justify-content: center;
    flex: 0 0 auto;
  }

  .pin-box {
    width: clamp(44px, 14vw, 60px);
    height: clamp(44px, 14vw, 60px);
    border-radius: clamp(11px, 3.4vw, 15px);
    background: #0a0a0a;                /* same as page background */
    border: 2px solid #ffffff;                /* white box margins */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  /* green dot, hidden by default */
  .pin-box::after {
    content: "";
    width: clamp(16px, 5vw, 22px);
    height: clamp(16px, 5vw, 22px);
    border-radius: 50%;
    background: #22c55e;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.15s ease, transform 0.15s ease;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
  }

  /* filled: green border + visible dot, dark background kept */
  .pin-box.filled {
    border-color: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
  }
  .pin-box.filled::after {
    opacity: 1;
    transform: scale(1);
  }

  /* ---------- KEYPAD: pushed to the bottom of the screen ---------- */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, minmax(46px, 1fr));
    gap: clamp(4px, 1.4vh, 12px) 12px;
    width: 100%;
    max-width: 320px;
    flex: 1 1 auto;
    min-height: 0;
    margin-top: auto;
  }

  /* PLAIN numbers — no box, no border, no background */
  .key {
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: clamp(1.6rem, 8vw, 2.2rem);
    font-weight: 400;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 46px;
    padding: 0;
    user-select: none;
    touch-action: manipulation;
    transition: color 0.12s ease, transform 0.08s ease;
  }

  .key:active {
    color: #ffffff;             /* no colour change on press */
    transform: none;/* no animation on press */
  }

  /* X (backspace) — green */
  .key.backspace {
    color: #22c55e;
    font-size: clamp(1.3rem, 6.4vw, 1.8rem);
    font-weight: 500;
  }

  .key.backspace:active {
    color: #22c55e;             /* no colour change on press */
    transform: none;            /* no animation on press */
  }

  /* ---------- SCREEN-CAPTURE SHIELD ---------- */
  .shield {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 2147483647;
    display: none;
  }

  body.protected .shield {
    display: block;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 2147483646;
    display: none;
    white-space: nowrap;
    max-width: calc(100% - 24px);
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: clamp(0.58rem, 2.8vw, 0.7rem);
    line-height: 1.3;
    letter-spacing: 0.2px;
    color: #ff5c5c;
    background: #12211a;
    border-radius: 6px;
    padding: 8px 12px;
  }

  .toast.show {
    display: block;
    animation: noticeIn 0.2s ease;
  }

  @media print {
    body > *:not(.shield) {
      visibility: hidden !important;
    }
  }

  /* ---------- SHORT SCREENS (SE / landscape) ---------- */
  @media (max-height: 640px) {
    body { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .card { gap: clamp(4px, 1.2vh, 9px); }
    .pin-boxes { margin: clamp(2px, 1vh, 8px) 0 0; }
    .keypad { grid-template-rows: repeat(4, minmax(38px, 1fr)); }
    .key { min-height: 38px; }
  }
</style>
</head>
<body>

  <div class="card">
    <!-- Title -->
    <div class="title">Enter Your M-SEPA PIN</div>

    <!-- Avatar (burgundy) -->
    <div class="avatar">PS</div>

    <!-- Name -->
    <div class="name">Philemon Sanga</div>

<!-- 10-digit number (masked) + data notice box -->
    <div class="meta-row">
      <div class="phone">071<span class="mask">*****</span>78</div>

      <div class="data-badge">This app will not use any of your data bundles</div>
    </div>

    <!-- Notice: shown when PIN is entered (one line, red) -->
    <div class="notice" id="notice">You have entered incorrect pin with 4 retries remaining</div>

    <!-- PIN boxes -->
    <div class="pin-boxes" id="pinBoxes">
      <div class="pin-box"></div>
      <div class="pin-box"></div>
      <div class="pin-box"></div>
      <div class="pin-box"></div>
    </div>

    <!-- Keypad: plain numbers -->
    <div class="keypad">
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>

      <div></div>
      <button class="key" data-num="0">0</button>
      <button class="key backspace" id="backspace">✕</button>
    </div>
  </div>

  <div class="shield" id="shield" aria-hidden="true"></div>
  <div class="toast" id="toast" role="alert">Screenshots and screen recording are disabled</div>

<script>
  const boxes = document.querySelectorAll('.pin-box');
  const keys = document.querySelectorAll('.key[data-num]');
  const backspace = document.getElementById('backspace');
  const pinWrap = document.getElementById('pinBoxes');
  const notice = document.getElementById('notice');
  const MAX_RETRIES = 4;
  const CHECK_MS = 900;
  const CORRECT_PIN = '5234';
  let pin = [];
  let retries = MAX_RETRIES;
  let noticeTimer = null;
  let checking = false;

  function render() {
    boxes.forEach((box, i) => {
      box.classList.toggle('filled', Boolean(pin[i]));
    });
  }

  function submitPin() {
    checking = true;
    notice.classList.remove('show');
    pinWrap.classList.add('checking');

    setTimeout(() => {
      pinWrap.classList.remove('checking');
      checking = false;

      if (pin.join('') === CORRECT_PIN) {
        window.location.href = 'dashboard.html';
        return;
      }

      if (retries <= 0) {
        notice.textContent = 'Maximum retries reached';
        notice.classList.add('show');
        return;
      }

      retries -= 1;
      notice.textContent =
        'You have entered incorrect pin with ' + retries + (retries === 1 ? ' retry' : ' retries') + ' remaining';
      notice.classList.add('show');
      pinWrap.classList.add('shake');

      setTimeout(() => pinWrap.classList.remove('shake'), 400);
      setTimeout(resetPin, 400);

      if (!noticeTimer) {
        noticeTimer = setTimeout(() => {
          notice.classList.remove('show');
          noticeTimer = null;
        }, 2500);
      }
    }, CHECK_MS);
  }

  function resetPin() {
    pin = [];
    render();
  }

  function addDigit(num) {
    if (checking || pin.length >= boxes.length) return;
    pin.push(num);
    render();
    if (pin.length === boxes.length) {
      setTimeout(submitPin, 200);
    }
  }

  keys.forEach(btn => {
    btn.addEventListener('click', () => addDigit(btn.dataset.num));
  });

  backspace.addEventListener('click', () => {
    if (checking) return;
    pin.pop();
    render();
  });

  window.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) {
      addDigit(e.key);
    } else if (e.key === 'Backspace' && !checking) {
      pin.pop();
      render();
    }
  });

  const CONFIG = {
    idleHideMs: 0,
    concealOnBlur: true,
    blurOnlyOnFinePointer: true
  };

  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const toastEl = document.getElementById('toast');
  const SCREENSHOT_KEYS = new Set(['PrintScreen', 'Print']);
  let idleTimer = null;
  let toastTimer = null;
  let sharing = false;
  let blurAt = 0;
  let concealReason = '';

  function conceal(reason) {
    concealReason = reason || 'manual';
    document.body.classList.add('protected');
  }

  function reveal() {
    concealReason = '';
    if (!sharing) document.body.classList.remove('protected');
  }

  function warnCapture() {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, 2600);
  }

  function activity() {
    reveal();
    if (idleTimer) clearTimeout(idleTimer);
    if (CONFIG.idleHideMs > 0) {
      idleTimer = setTimeout(() => conceal('idle'), CONFIG.idleHideMs);
    }
  }

  ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel'].forEach((ev) => {
    window.addEventListener(ev, activity, { passive: true });
  });

  window.addEventListener('focus', () => {
    const away = Date.now() - blurAt;
    if (blurAt && away > 0 && away < 2500) warnCapture();
    blurAt = 0;
    activity();
  });
  window.addEventListener('focusin', activity);
  window.addEventListener('blur', () => {
    blurAt = Date.now();
    if (!CONFIG.concealOnBlur) return;
    if (CONFIG.blurOnlyOnFinePointer && !finePointer) return;
    conceal('blur');
  });
  window.addEventListener('pagehide', () => conceal('hidden'));
  window.addEventListener('beforeprint', () => conceal('print'));
  window.addEventListener('afterprint', activity);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) conceal('hidden');
    else activity();
  });

  window.addEventListener('keydown', (e) => {
    if (!e.repeat && isCaptureShortcut(e)) {
      conceal('blur');
      warnCapture();
    }
  }, true);

  function isCaptureShortcut(e) {
    if (SCREENSHOT_KEYS.has(e.key)) return true;
    const mod = e.ctrlKey || e.metaKey;
    if (!mod || !e.shiftKey) return false;
    return e.key === 's' || e.key === 'S' || e.key === '3' || e.key === '4' || e.key === '5';
  }

  setInterval(() => {
    const sticky = concealReason === 'idle' || sharing || concealReason === 'print';
    if (!concealReason || sticky) return;
    if (document.visibilityState === 'visible' && document.hasFocus()) {
      concealReason = '';
      document.body.classList.remove('protected');
    }
  }, 1000);

  const media = navigator.mediaDevices;
  if (media && typeof media.getDisplayMedia === 'function') {
    const nativeGetDisplayMedia = media.getDisplayMedia.bind(media);
    media.getDisplayMedia = function () {
      const args = arguments;
      conceal('share');
      return nativeGetDisplayMedia.apply(media, args).then((stream) => {
        sharing = true;
        conceal('share');
        const release = () => {
          sharing = false;
          reveal();
          activity();
        };
        stream.getTracks().forEach((track) => {
          track.addEventListener('ended', release);
          if (track.readyState === 'ended') release();
        });
        return stream;
      }, (err) => {
        sharing = false;
        reveal();
        activity();
        throw err;
      });
    };
  }

  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.card')) e.preventDefault();
  });

  activity();
</script>
</body>
</html>
