<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 4vw, 20px);
    padding-top: max(clamp(12px, 4vw, 20px), env(safe-area-inset-top));
    padding-bottom: max(clamp(12px, 4vw, 20px), env(safe-area-inset-bottom));
  }

  /* ---------- LEFT: avatar + greeting ---------- */
  .left {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vw, 12px);
    min-width: 0;
  }

  .avatar {
    flex: 0 0 auto;
    width: clamp(38px, 11vw, 46px);
    height: clamp(38px, 11vw, 46px);
    border-radius: 50%;
    background: #660033;
    border: 2px solid #660033;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.85rem, 3.6vw, 1rem);
    font-weight: 600;
    color: #f472b6;
    overflow: hidden;
  }

  .greet {
    min-width: 0;
  }

  .hi {
    font-size: clamp(0.72rem, 3.2vw, 0.85rem);
    color: #ffffff;
    opacity: 0.75;
    line-height: 1.2;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.3;
    white-space: nowrap;
  }

  .wave {
    font-size: clamp(0.85rem, 3.8vw, 1rem);
    line-height: 1;
  }

  /* ---------- RIGHT: notification + search ---------- */
  .actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 2vw, 12px);
  }

  .icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(34px, 9.5vw, 40px);
    height: clamp(34px, 9.5vw, 40px);
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #22c55e;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .icon:hover,
  .icon:active {
    background: #1a1a1a;
  }

  /* notification: small red dot */
  .dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 0 2px #0a0a0a;
  }

  /* search: green circle, red handle */
  .icon.search .glass {
    stroke: #22c55e;
  }

  .icon.search .handle {
    stroke: #ef4444;
  }

  /* ---------- NAVBAR BOTTOM EDGE ---------- */
  .topbar {
    border-bottom: 1px solid #1c1c1c;
  }

  /* ---------- SMALL SECTION HEADER ---------- */
  .mini-head {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 clamp(8px, 2.5vw, 12px) clamp(8px, 2vw, 12px);
  }

  .mini-title {
    font-size: clamp(0.78rem, 3.6vw, 0.95rem);
    font-weight: 600;
    color: #ffffff;
  }

  .fire {
    font-size: clamp(0.75rem, 3.4vw, 0.9rem);
  }

  /* ---------- PRODUCT CARDS (horizontal scroll) ---------- */
  .products {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 3.5vw, 18px) 0;
  }

  .track {
    display: flex;
    gap: clamp(10px, 3vw, 14px);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 2px clamp(12px, 4vw, 20px);
    scrollbar-width: none;
  }

  .track::-webkit-scrollbar {
    display: none;
  }

  .card {
    position: relative;
    flex: 0 0 auto;
    height: clamp(140px, 40vw, 186px);
    border-radius: 14px;
    background: #141414;
    border: 1px solid #1f1f1f;
    padding: clamp(10px, 3vw, 14px);
    padding-left: clamp(15px, 4.5vw, 20px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    scroll-snap-align: start;
    overflow: hidden;
  }

  /* left accent strip: green at top, blue at bottom */
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #22c55e 0%, #3b82f6 100%);
  }

  .card.wide,
  .card.small {
    width: 85%;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .tag {
    font-size: clamp(0.6rem, 2.6vw, 0.7rem);
    color: #ffffff;
    opacity: 0.7;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .chip {
    font-size: clamp(0.55rem, 2.4vw, 0.65rem);
    color: #22c55e;
    background: #10281a;
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .amount {
    font-size: clamp(1.1rem, 5.4vw, 1.5rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .caption {
    font-size: clamp(0.62rem, 2.7vw, 0.72rem);
    color: #ffffff;
    opacity: 0.6;
  }

  /* ---------- BALANCE CARD ---------- */
  .card.balance {
    background: #141414;
    border-color: #1f1f1f;
  }

  .card.balance .tag {
    color: #22c55e;
    opacity: 1;
  }

  .bal-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .bal {
    font-size: clamp(1.25rem, 6vw, 1.7rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .bal.blurred {
    filter: blur(5px);
    user-select: none;
  }

  .eye {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  .eye:active {
    background: rgba(255, 255, 255, 0.12);
  }

  .stmt {
    align-self: stretch;
    margin-top: 2px;
    font-family: inherit;
    font-size: clamp(0.68rem, 3.1vw, 0.8rem);
    font-weight: 600;
    color: #86efac;
    background: #141414;                /* dark, same as the card */
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: clamp(6px, 1.5vh, 9px) 10px;
    cursor: pointer;
  }

  /* green label variant */
  .tag.green {
    color: #22c55e;
    opacity: 1;
  }

  .svc {
    font-size: clamp(0.85rem, 4vw, 1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.2;
  }

  /* ---------- QUICK ACTIONS ---------- */
  .quick {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 clamp(8px, 2.5vw, 12px) clamp(16px, 4vw, 24px);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    flex: 0 0 auto;
  }

  .section-title {
    font-size: clamp(0.8rem, 3.6vw, 0.95rem);
    font-weight: 600;
    color: #ffffff;
  }

  .view-all {
    font-family: inherit;
    font-size: clamp(0.68rem, 3.2vw, 0.8rem);
    font-weight: 600;
    color: #22c55e;
    background: none;
    border: none;
    padding: 4px 0;
    cursor: pointer;
  }

  /* full-width card, taller than the scrollers — same-colour hairline edge */
  .card.big {
    width: 100%;
    height: calc(clamp(140px, 40vw, 186px) * 1.5);
    border: 1px solid #141414;
    border-radius: 6px;
    padding: clamp(8px, 2.4vw, 11px) clamp(10px, 3vw, 13px);
    padding-left: clamp(12px, 3.4vw, 15px);
    justify-content: flex-start;
    gap: clamp(6px, 2vw, 10px);
  }

  /* ---------- QUICK ACTION GRID ---------- */
  .qa-grid {
    flex: 1 1 auto;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(4px, 1.6vw, 8px);
  }

  .qa {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 2vw, 10px);
    padding: clamp(4px, 1.4vw, 8px) 2px;
    text-align: center;
    cursor: pointer;
  }

  .icon-circle {
    width: clamp(34px, 8.6vw, 50px);
    height: clamp(34px, 8.6vw, 50px);
    border-radius: 50%;
    background: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .qa svg {
    width: 66%;
    height: auto;
    flex: 0 0 auto;
  }

  /* Send Money uses a supplied jpeg whose artwork runs to the frame corners, so it is
     inset (not cropped) and screen-blended to drop its black backdrop into the circle */
  .qa .qa-photo {
    width: 70%;
    height: 70%;
    object-fit: contain;
    display: block;
    flex: 0 0 auto;
    mix-blend-mode: screen;
  }

  /* Images whose backdrop is dark grey rather than pure black: screen would lift the
     backdrop off the #2b2b2b circle and leave a faint square, lighten lands it exactly */
  .qa .qa-photo-padded {
    mix-blend-mode: lighten;
  }

  /* Artwork fills only part of these frames, so each is scaled to match the visual
     weight of the svg icons; sizes are capped so no artwork is clipped by the circle */
  .qa .qa-photo-pochi {
    width: 86%;
    height: 86%;
  }

  /* This frame carries the most empty margin (art is only 44% across), so the box is
     well past 100%. Safe because the artwork sits at just 53% of the frame half-width,
     leaving it 80% of the circle radius at this size; its dark backdrop is dropped by
     lighten, so the box overhanging the circle is invisible. Hard ceiling is 188%. */
  .qa .qa-photo-withdraw {
    width: 151%;
    height: 151%;
  }

  .qa span {
    font-size: clamp(0.68rem, 3.4vw, 0.88rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.05;              /* lines sit almost on top of each other */
  }

  .card.big::before {
    display: none;
  }
/* ---------- SMALL LINK ROW ---------- */
  .link-row {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 clamp(8px, 2.5vw, 12px) clamp(16px, 4vw, 24px);
  }

  .link-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #141414;
    border: 1px solid #141414;
    border-radius: 10px;
    padding: clamp(11px, 3vw, 15px) clamp(13px, 3.4vw, 18px);
    cursor: pointer;
  }

  .link-box span {
    font-size: clamp(0.74rem, 3.5vw, 0.88rem);
    font-weight: 600;
    color: #ffffff;
  }

  .link-box svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: #ffffff;
  }
/* ---------- SMALL IMAGE CAROUSEL ---------- */
  .carousel {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding-bottom: clamp(16px, 4vw, 24px);
  }

  .mini-track {
    display: flex;
    gap: clamp(8px, 2.5vw, 12px);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 2px clamp(12px, 4vw, 20px);
    scrollbar-width: none;
  }

  .mini-track::-webkit-scrollbar {
    display: none;
  }

  .card.mini {
    position: relative;
    width: 100%;
    height: clamp(120px, 34vw, 160px);
    padding: 0;
    scroll-snap-align: start;
  }

  .card.mini::before {
    display: none;
  }

  .shot {
    position: absolute;
    inset: 0;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .shot .ph {
    font-size: clamp(0.6rem, 2.8vw, 0.72rem);
    color: #ffffff;
    opacity: 0.45;
  }

  .shot img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .shot img.on {
    opacity: 1;
  }

  /* ---------- FLOATING LAYER: SCAN TO PAY + ASSISTANT ---------- */
  /* sized for a phone browser: compact, bottom-right, never alters page layout */
  :root {
    --scan-bottom: 14px;
    --scan-height: 56px;
    --fab-gap: 10px;
    --fab-size: 56px;
    --fab-right: 14px;
  }

  .float-layer {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
  }

  .float-layer > * {
    pointer-events: auto;
  }

  .fab-assist {
    position: fixed;
    right: var(--fab-right);
    bottom: calc(var(--scan-bottom) + var(--scan-height) + var(--fab-gap));
    width: var(--fab-size);
    height: var(--fab-size);
    padding: 0;
    border: 0;
    border-radius: 16px;
    background: #292929;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    cursor: pointer;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }

  .fab-assist svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fab-assist img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* the real images are shown; the inline drawings are hidden fallbacks */
  .fab-assist .fab-face,
  .fab-scan .qr {
    display: block;
  }

  .fab-assist .fab-drawing,
  .fab-scan .qr-drawing {
    display: none;
  }

  .fab-scan {
    position: fixed;
    right: var(--fab-right);
    bottom: var(--scan-bottom);
    width: min(230px, calc(100vw - 28px));
    max-width: calc(100vw - 28px);
    height: var(--scan-height);
    padding: 0 14px;
    border: 0;
    border-radius: 18px;
    background: #292929;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    color: #f3f3f3;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .fab-scan .qr {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    display: block;
    object-fit: cover;
    border-radius: 6px;
  }

  .fab-scan .txt {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.1px;
    white-space: nowrap;
  }

  @media (min-width: 480px) {
    :root {
      --scan-bottom: 18px;
      --scan-height: 64px;
      --fab-gap: 12px;
      --fab-size: 64px;
      --fab-right: 18px;
    }

    .fab-scan {
      width: 268px;
      border-radius: 20px;
      padding: 0 18px;
    }

    .fab-scan .qr {
      flex-basis: 38px;
      width: 38px;
      height: 38px;
      border-radius: 7px;
    }

    .fab-scan .txt {
      font-size: 17px;
    }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="left">
      <div class="avatar">PS</div>
      <div class="greet">
        <div class="hi" id="greeting">Good evening</div>
        <div class="who">Philemon <span class="wave">👋</span></div>
      </div>
    </div>

    <div class="actions">
      <button class="icon" type="button" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="dot"></span>
      </button>

      <button class="icon search" type="button" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle class="glass" cx="11" cy="11" r="7"></circle>
          <line class="handle" x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </header>

  <section class="products">
    <div class="track">
      <article class="card wide balance">
        <div class="card-top">
          <span class="tag">M-SEPA Balance</span>
        </div>

        <div class="bal-row">
          <span class="bal" id="balance">Ksh 1,500.00</span>
          <button class="eye" id="eye" type="button" aria-label="Hide balance">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button class="stmt" type="button">View statement</button>
      </article>

      <article class="card wide">
        <div class="card-top">
          <span class="tag green">My balances</span>
        </div>

        <div class="svc">Airtime</div>
        <div class="bal" id="balance2">Ksh. 0</div>

        <button class="stmt" type="button">View balance</button>
      </article>
    </div>
  </section>

  <section class="quick">
    <article class="card big">
      <div class="section-head">
        <h2 class="section-title">Quick Actions</h2>
        <button class="view-all" type="button">View all &gt;</button>
      </div>

      <div class="qa-grid">
        <div class="qa">
          <div class="icon-circle">
            <img class="qa-photo" src="send money.jpeg" alt="">
          </div>
          <span>Send<br>Money</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M15 21a9 9 0 0 1 18 0" stroke="#F04B50" stroke-width="3.4" stroke-linecap="round"></path>
              <path d="M8 21h32M8 21l4 15h24l4-15" stroke="#39B54A" stroke-width="3.4" stroke-linecap="round"
                    stroke-linejoin="round"></path>
              <path d="M17 24.5v8M24 24.5v8M31 24.5v8" stroke="#39B54A" stroke-width="2.8"
                    stroke-linecap="round"></path>
            </svg>
          </div>
          <span>Lipa na<br>M-PESA</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <img class="qa-photo qa-photo-padded qa-photo-withdraw" src="witdraw money.jpeg" alt="">
          </div>
          <span>Withdraw<br>Money</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <img class="qa-photo qa-photo-padded qa-photo-pochi" src="pochi wallet.jpeg" alt="">
          </div>
          <span>Pochi<br>Wallet</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <text x="24" y="22.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                    font-size="12.6" font-weight="800" letter-spacing="-0.2" fill="#39B54A">PATA</text>
              <text x="24" y="36.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                    font-size="12.6" font-weight="800" letter-spacing="-0.2" fill="#F04B50">MORE</text>
            </svg>
          </div>
          <span>Buy<br>Bundles</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <g transform="translate(2 8) scale(1.4)">
                <path d="M8.4 5.6c-2 1.4-2.6 3.9-1.6 6.4 1.5 3.7 4.5 6.7 8.2 8.2 2.5 1 5 .6 6.4-1.6.3-.4.2-1-.2-1.3l-2.2-1.6c-.4-.3-1-.2-1.3.2l-.8 1c-1.8-.7-3.4-2.3-4.1-4.1l1-.8c.4-.3.5-.9.2-1.3L12.4 8.6c-.3-.4-.9-.5-1.3-.2Z"
                      stroke="#39B54A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
              </g>
              <path d="M28.5 22.5 39 12" stroke="#F04B50" stroke-width="3.4" stroke-linecap="round"></path>
              <path d="M31.2 13.8 39 12 37.2 19.8" stroke="#F04B50" stroke-width="3.4" stroke-linecap="round"
                    stroke-linejoin="round"></path>
            </svg>
          </div>
          <span>Airtime<br>Top Up</span>
        </div>

        <div class="qa">
          <div class="icon-circle">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <rect x="6.5" y="15.5" width="35" height="6" rx="1.5" stroke="#39B54A" stroke-width="3.2"></rect>

<script>
  /* ---------- ADMIN OVERRIDES (saved from admin.html) ---------- */
  const ADMIN_KEY = 'mpesa_admin_v1';

  function applyAdminValues() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(ADMIN_KEY));
    } catch (err) {
      return;
    }
    if (!saved) return;
    ['balance', 'balance2'].forEach((id) => {
      const el = document.getElementById(id);
      const val = saved[id];
      if (el && typeof val === 'string' && val.trim()) el.textContent = val.trim();
    });
  }

  function applyAssistantImage() {
    const btn = document.querySelector('.fab-assist');
    if (!btn) return;
    let url = '';
    try {
      const saved = JSON.parse(localStorage.getItem(ADMIN_KEY));
      if (saved && typeof saved.assistant === 'string') url = saved.assistant.trim();
    } catch (err) {
      url = '';
    }
    const img = btn.querySelector('.fab-face');
    const drawing = btn.querySelector('.fab-drawing');
    img.src = url || 'zuri.jpeg';
    img.style.display = 'block';
    drawing.style.display = 'none';
  }

  /* if a bundled image is missing, fall back to the inline drawing */
  function fabImageFallback() {
    const face = document.querySelector('.fab-assist .fab-face');
    if (face && (!face.complete || face.naturalWidth === 0)) {
      face.style.display = 'none';
      document.querySelector('.fab-assist .fab-drawing').style.display = 'block';
    }
    const qr = document.querySelector('.fab-scan .qr');
    if (qr && (!qr.complete || qr.naturalWidth === 0)) {
      qr.style.display = 'none';
      document.querySelector('.fab-scan .qr-drawing').style.display = 'block';
    }
  }

  applyAdminValues();
  window.addEventListener('load', () => {
    applyAssistantImage();
    fabImageFallback();
  });
  window.addEventListener('storage', (e) => {
    if (e.key === ADMIN_KEY) {
      applyAdminValues();
      applyAssistantImage();
      renderCarousel();
    }
  });

  /* ---------- TIME-BASED GREETING ---------- */
  const GREETINGS = [
    [0, 12, 'Good morning'],
    [12, 15, 'Good afternoon'],
    [15, 24, 'Good evening'],
  ];

  function setGreeting() {
    const h = new Date().getHours();
    const hit = GREETINGS.find(([from, to]) => h >= from && h < to);
    document.getElementById('greeting').textContent = hit ? hit[2] : 'Good evening';
  }

  setGreeting();
  setInterval(setGreeting, 60000);

  const balance = document.getElementById('balance');
  const eyeIcon = document.getElementById('eyeIcon');

  let hidden = false;

  document.getElementById('eye').addEventListener('click', () => {
    hidden = !hidden;
    balance.classList.toggle('blurred', hidden);
    eyeIcon.innerHTML = hidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
  });

  /* ---------- IMAGE CAROUSEL (rotates every 5s) ---------- */
  /* fallback sources, used when the admin has not saved any URLs for a card */
  const DEFAULT_SLIDES = [
    ['images/deal-1.jpg', 'images/deal-2.jpg', 'images/deal-3.jpg'],
    ['images/flash-1.jpg', 'images/flash-2.jpg'],
    ['images/offer-1.jpg', 'images/offer-2.jpg', 'images/offer-3.jpg'],
  ];

  const ROTATE_MS = 5000;
  let rotateTimer = null;

  function slideSources() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(ADMIN_KEY));
    } catch (err) {
      saved = null;
    }
    const admin = saved && Array.isArray(saved.carousel) ? saved.carousel : [];
    return DEFAULT_SLIDES.map((fallback, i) => {
      if (!Array.isArray(admin[i])) return fallback;
      return admin[i].map((u) => (typeof u === 'string' ? u.trim() : '')).filter(Boolean);
    });
  }

  function renderCarousel() {
    if (rotateTimer) clearInterval(rotateTimer);
    const sources = slideSources();
    const shots = Array.from(document.querySelectorAll('.shot'));
    const frames = shots.map(() => ({ imgs: [], at: 0 }));

    shots.forEach((shot, i) => {
      shot.innerHTML = '<span class="ph">image 1</span>';
      (sources[i] || []).forEach((src) => {
        const img = new Image();
        img.src = src;
        img.alt = '';
        img.addEventListener('load', () => {
          const ph = shot.querySelector('.ph');
          if (ph) ph.remove();
          if (!frames[i].imgs.some((n) => n.classList.contains('on'))) img.classList.add('on');
        });
        img.addEventListener('error', () => {
          img.remove();
          frames[i].imgs = frames[i].imgs.filter((n) => n !== img);
          const ph = shot.querySelector('.ph');
          if (ph) ph.textContent = 'image failed to load';
        });
        frames[i].imgs.push(img);
        shot.appendChild(img);
      });
      if (frames[i].imgs.length) frames[i].imgs[0].classList.add('on');
    });

    rotateTimer = setInterval(() => {
      frames.forEach((frame) => {
        if (frame.imgs.length < 1) return;
        frame.imgs.forEach((img) => img.classList.remove('on'));
        frame.at = (frame.at + 1) % frame.imgs.length;
        frame.imgs[frame.at].classList.add('on');
      });
    }, ROTATE_MS);
  }

  renderCarousel();
</script>
