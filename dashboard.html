<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 4vw, 20px);
    padding-top: max(clamp(12px, 4vw, 20px), env(safe-area-inset-top));
    padding-bottom: max(clamp(12px, 4vw, 20px), env(safe-area-inset-bottom));
  }

  /* ---------- LEFT: avatar + greeting ---------- */
  .left {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vw, 12px);
    min-width: 0;
  }

  .avatar {
    flex: 0 0 auto;
    width: clamp(38px, 11vw, 46px);
    height: clamp(38px, 11vw, 46px);
    border-radius: 50%;
    background: #660033;
    border: 2px solid #660033;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.85rem, 3.6vw, 1rem);
    font-weight: 600;
    color: #f472b6;
    overflow: hidden;
  }

  .greet {
    min-width: 0;
  }

  .hi {
    font-size: clamp(0.72rem, 3.2vw, 0.85rem);
    color: #ffffff;
    opacity: 0.75;
    line-height: 1.2;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.3;
    white-space: nowrap;
  }

  .wave {
    font-size: clamp(0.85rem, 3.8vw, 1rem);
    line-height: 1;
  }

  /* ---------- RIGHT: notification + search ---------- */
  .actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 2vw, 12px);
  }

  .icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(34px, 9.5vw, 40px);
    height: clamp(34px, 9.5vw, 40px);
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #22c55e;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .icon:hover,
  .icon:active {
    background: #1a1a1a;
  }

  /* notification: small red dot */
  .dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 0 2px #0a0a0a;
  }

  /* search: green circle, red handle */
  .icon.search .glass {
    stroke: #22c55e;
  }

  .icon.search .handle {
    stroke: #ef4444;
  }

  /* ---------- NAVBAR BOTTOM EDGE ---------- */
  .topbar {
    border-bottom: 1px solid #1c1c1c;
  }

  /* ---------- PRODUCT CARDS (horizontal scroll) ---------- */
  .products {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 3.5vw, 18px) 0;
  }

  .track {
    display: flex;
    gap: clamp(10px, 3vw, 14px);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 2px clamp(12px, 4vw, 20px);
    scrollbar-width: none;
  }

  .track::-webkit-scrollbar {
    display: none;
  }

  .card {
    position: relative;
    flex: 0 0 auto;
    height: clamp(140px, 40vw, 186px);
    border-radius: 14px;
    background: #141414;
    border: 1px solid #1f1f1f;
    padding: clamp(10px, 3vw, 14px);
    padding-left: clamp(15px, 4.5vw, 20px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    scroll-snap-align: start;
    overflow: hidden;
  }

  /* left accent strip: green at top, blue at bottom */
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #22c55e 0%, #3b82f6 100%);
  }

  .card.wide,
  .card.small {
    width: 85%;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .tag {
    font-size: clamp(0.6rem, 2.6vw, 0.7rem);
    color: #ffffff;
    opacity: 0.7;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .chip {
    font-size: clamp(0.55rem, 2.4vw, 0.65rem);
    color: #22c55e;
    background: #10281a;
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .amount {
    font-size: clamp(1.1rem, 5.4vw, 1.5rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .caption {
    font-size: clamp(0.62rem, 2.7vw, 0.72rem);
    color: #ffffff;
    opacity: 0.6;
  }

  /* ---------- BALANCE CARD ---------- */
  .card.balance {
    background: #141414;
    border-color: #1f1f1f;
  }

  .card.balance .tag {
    color: #22c55e;
    opacity: 1;
  }

  .bal-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .bal {
    font-size: clamp(1.25rem, 6vw, 1.7rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .bal.blurred {
    filter: blur(5px);
    user-select: none;
  }

  .eye {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  .eye:active {
    background: rgba(255, 255, 255, 0.12);
  }

  .stmt {
    align-self: stretch;
    margin-top: 2px;
    font-family: inherit;
    font-size: clamp(0.68rem, 3.1vw, 0.8rem);
    font-weight: 600;
    color: #86efac;
    background: #141414;                /* dark, same as the card */
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: clamp(6px, 1.5vh, 9px) 10px;
    cursor: pointer;
  }

  /* green label variant */
  .tag.green {
    color: #22c55e;
    opacity: 1;
  }

  .svc {
    font-size: clamp(0.85rem, 4vw, 1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.2;
  }

  /* ---------- QUICK ACTIONS ---------- */
  .quick {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 clamp(8px, 2.5vw, 12px) clamp(16px, 4vw, 24px);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    flex: 0 0 auto;
  }

  .section-title {
    font-size: clamp(0.8rem, 3.6vw, 0.95rem);
    font-weight: 600;
    color: #ffffff;
  }

  .view-all {
    font-family: inherit;
    font-size: clamp(0.68rem, 3.2vw, 0.8rem);
    font-weight: 600;
    color: #22c55e;
    background: none;
    border: none;
    padding: 4px 0;
    cursor: pointer;
  }

  /* full-width card, taller than the scrollers — same-colour hairline edge */
  .card.big {
    width: 100%;
    height: calc(clamp(140px, 40vw, 186px) * 1.5);
    border: 1px solid #141414;
    border-radius: 6px;
    padding: clamp(8px, 2.4vw, 11px) clamp(10px, 3vw, 13px);
    padding-left: clamp(12px, 3.4vw, 15px);
    justify-content: flex-start;
    gap: clamp(6px, 2vw, 10px);
  }

  /* ---------- QUICK ACTION GRID ---------- */
  .qa-grid {
    flex: 1 1 auto;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(4px, 1.6vw, 8px);
  }

  .qa {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 2vw, 10px);
    padding: clamp(4px, 1.4vw, 8px) 2px;
    text-align: center;
    cursor: pointer;
  }

  .qa svg {
    width: clamp(30px, 9.5vw, 44px);
    height: auto;
    color: #22c55e;
  }

  .qa span {
    font-size: clamp(0.68rem, 3.4vw, 0.88rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.05;              /* lines sit almost on top of each other */
  }

  .card.big::before {
    display: none;
  }
/* ---------- SMALL LINK ROW ---------- */
  .link-row {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 clamp(8px, 2.5vw, 12px) clamp(16px, 4vw, 24px);
  }

  .link-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #141414;
    border: 1px solid #141414;
    border-radius: 10px;
    padding: clamp(11px, 3vw, 15px) clamp(13px, 3.4vw, 18px);
    cursor: pointer;
  }

  .link-box span {
    font-size: clamp(0.74rem, 3.5vw, 0.88rem);
    font-weight: 600;
    color: #ffffff;
  }

  .link-box svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: #ffffff;
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="left">
      <div class="avatar">PS</div>
      <div class="greet">
        <div class="hi">Good evening</div>
        <div class="who">Philemon <span class="wave">👋</span></div>
      </div>
    </div>

    <div class="actions">
      <button class="icon" type="button" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="dot"></span>
      </button>

      <button class="icon search" type="button" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle class="glass" cx="11" cy="11" r="7"></circle>
          <line class="handle" x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </header>

  <section class="products">
    <div class="track">
      <article class="card wide balance">
        <div class="card-top">
          <span class="tag">M-SEPA Balance</span>
        </div>

        <div class="bal-row">
          <span class="bal" id="balance">Ksh 1,500.00</span>
          <button class="eye" id="eye" type="button" aria-label="Hide balance">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button class="stmt" type="button">View statement</button>
      </article>

      <article class="card wide">
        <div class="card-top">
          <span class="tag green">My balances</span>
        </div>

        <div class="svc">Airtime</div>
        <div class="bal">Ksh. 0</div>

        <button class="stmt" type="button">View balance</button>
      </article>
    </div>
  </section>

<section class="quick">
    <article class="card big">
      <div class="section-head">
        <h2 class="section-title">Quick Actions</h2>
        <button class="view-all" type="button">View all &gt;</button>
      </div>

      <div class="qa-grid">
        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <path d="M7 7h10v10"></path>
          </svg>
          <span>Send<br>Money</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
          <span>Lipa na<br>M-SEPA</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="3" x2="12" y2="15"></line>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="4" y1="21" x2="20" y2="21"></line>
          </svg>
          <span>Withdraw<br>Money</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2"></path>
            <rect x="3" y="8" width="18" height="12" rx="2"></rect>
            <circle cx="16" cy="14" r="1.4"></circle>
          </svg>
          <span>Pochi<br>Wallet</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 7h12l1 13H5L6 7z"></path>
            <path d="M9 7a3 3 0 0 1 6 0"></path>
          </svg>
          <span>Buy<br>Bundles</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="7" y="2" width="10" height="20" rx="2"></rect>
            <line x1="11" y1="18" x2="13" y2="18"></line>
          </svg>
          <span>Airtime<br>Top Up</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="20" x2="4" y2="16"></line>
            <line x1="9" y1="20" x2="9" y2="12"></line>
            <line x1="14" y1="20" x2="14" y2="8"></line>
            <line x1="19" y1="20" x2="19" y2="4"></line>
          </svg>
          <span>Tunikiwa<br>Bundles</span>
        </div>

        <div class="qa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11a11 11 0 0 1 16 0"></path>
            <path d="M7.5 14.5a6.5 6.5 0 0 1 9 0"></path>
            <circle cx="12" cy="18.5" r="1.2"></circle>
          </svg>
          <span>Home<br>Internet</span>
        </div>
      </div>
    </article>
  </section>

  <section class="link-row">
    <div class="link-box">
      <span>Frequets</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </section>

<script>
  const balance = document.getElementById('balance');
  const eyeIcon = document.getElementById('eyeIcon');

  let hidden = false;

  document.getElementById('eye').addEventListener('click', () => {
    hidden = !hidden;
    balance.classList.toggle('blurred', hidden);
    eyeIcon.innerHTML = hidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
  });
</script>

</body>
</html>
