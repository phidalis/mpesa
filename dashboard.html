<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 4vw, 20px);
    padding-top: max(clamp(12px, 4vw, 20px), env(safe-area-inset-top));
    padding-bottom: max(clamp(12px, 4vw, 20px), env(safe-area-inset-bottom));
  }

  /* ---------- LEFT: avatar + greeting ---------- */
  .left {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vw, 12px);
    min-width: 0;
  }

  .avatar {
    flex: 0 0 auto;
    width: clamp(38px, 11vw, 46px);
    height: clamp(38px, 11vw, 46px);
    border-radius: 50%;
    background: #660033;
    border: 2px solid #660033;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.85rem, 3.6vw, 1rem);
    font-weight: 600;
    color: #f472b6;
    overflow: hidden;
  }

  .greet {
    min-width: 0;
  }

  .hi {
    font-size: clamp(0.72rem, 3.2vw, 0.85rem);
    color: #ffffff;
    opacity: 0.75;
    line-height: 1.2;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.3;
    white-space: nowrap;
  }

  .wave {
    font-size: clamp(0.85rem, 3.8vw, 1rem);
    line-height: 1;
  }

  /* ---------- RIGHT: notification + search ---------- */
  .actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 2vw, 12px);
  }

  .icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(34px, 9.5vw, 40px);
    height: clamp(34px, 9.5vw, 40px);
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #22c55e;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .icon:hover,
  .icon:active {
    background: #1a1a1a;
  }

  /* notification: small red dot */
  .dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 0 2px #0a0a0a;
  }

  /* search: green circle, red handle */
  .icon.search .glass {
    stroke: #22c55e;
  }

  .icon.search .handle {
    stroke: #ef4444;
  }

  /* ---------- NAVBAR BOTTOM EDGE ---------- */
  .topbar {
    border-bottom: 1px solid #1c1c1c;
  }

  /* ---------- PRODUCT CARDS (horizontal scroll) ---------- */
  .products {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: clamp(12px, 3.5vw, 18px) 0;
  }

  .track {
    display: flex;
    gap: clamp(10px, 3vw, 14px);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 2px clamp(12px, 4vw, 20px);
    scrollbar-width: none;
  }

  .track::-webkit-scrollbar {
    display: none;
  }

  .card {
    position: relative;
    flex: 0 0 auto;
    height: clamp(140px, 40vw, 186px);
    border-radius: 14px;
    background: #141414;
    border: 1px solid #1f1f1f;
    padding: clamp(10px, 3vw, 14px);
    padding-left: clamp(15px, 4.5vw, 20px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    scroll-snap-align: start;
    overflow: hidden;
  }

  /* left accent strip: green at top, blue at bottom */
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #22c55e 0%, #3b82f6 100%);
  }

  .card.wide,
  .card.small {
    width: 85%;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .tag {
    font-size: clamp(0.6rem, 2.6vw, 0.7rem);
    color: #ffffff;
    opacity: 0.7;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .chip {
    font-size: clamp(0.55rem, 2.4vw, 0.65rem);
    color: #22c55e;
    background: #10281a;
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .amount {
    font-size: clamp(1.1rem, 5.4vw, 1.5rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .caption {
    font-size: clamp(0.62rem, 2.7vw, 0.72rem);
    color: #ffffff;
    opacity: 0.6;
  }

  /* ---------- BALANCE CARD ---------- */
  .card.balance {
    background: #141414;
    border-color: #1f1f1f;
  }

  .card.balance .tag {
    color: #22c55e;
    opacity: 1;
  }

  .bal-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .bal {
    font-size: clamp(1.25rem, 6vw, 1.7rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
  }

  .bal.blurred {
    filter: blur(5px);
    user-select: none;
  }

  .eye {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  .eye:active {
    background: rgba(255, 255, 255, 0.12);
  }

  .stmt {
    align-self: stretch;
    margin-top: 2px;
    font-family: inherit;
    font-size: clamp(0.68rem, 3.1vw, 0.8rem);
    font-weight: 600;
    color: #86efac;
    background: #141414;                /* dark, same as the card */
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: clamp(6px, 1.5vh, 9px) 10px;
    cursor: pointer;
  }

  /* green label variant */
  .tag.green {
    color: #22c55e;
    opacity: 1;
  }

  .svc {
    font-size: clamp(0.85rem, 4vw, 1rem);
    font-weight: 600;
    color: #ffffff;
    line-height: 1.2;
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="left">
      <div class="avatar">PS</div>
      <div class="greet">
        <div class="hi">Good evening</div>
        <div class="who">Philemon <span class="wave">👋</span></div>
      </div>
    </div>

    <div class="actions">
      <button class="icon" type="button" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="dot"></span>
      </button>

      <button class="icon search" type="button" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle class="glass" cx="11" cy="11" r="7"></circle>
          <line class="handle" x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </header>

  <section class="products">
    <div class="track">
      <article class="card wide balance">
        <div class="card-top">
          <span class="tag">M-SEPA Balance</span>
        </div>

        <div class="bal-row">
          <span class="bal" id="balance">Ksh 1,500.00</span>
          <button class="eye" id="eye" type="button" aria-label="Hide balance">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button class="stmt" type="button">View statement</button>
      </article>

      <article class="card wide">
        <div class="card-top">
          <span class="tag green">My balances</span>
        </div>

        <div class="svc">Airtime</div>
        <div class="bal">Ksh. 0</div>

        <button class="stmt" type="button">View balance</button>
      </article>
    </div>
  </section>

<script>
  const balance = document.getElementById('balance');
  const eyeIcon = document.getElementById('eyeIcon');

  let hidden = false;

  document.getElementById('eye').addEventListener('click', () => {
    hidden = !hidden;
    balance.classList.toggle('blurred', hidden);
    eyeIcon.innerHTML = hidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
  });
</script>

</body>
</html>
